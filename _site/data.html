<script src="https://cdn.jsdelivr.net/lodash/4.17.4/lodash.min.js"></script>
<script src="https://d3js.org/d3.v4.min.js"></script>
<script src="http://localhost:4001/assets/dtree/dTree.min.js"></script>
<body>
		<h1>Потомки</h1>
    <div id="graph"></div>

		<script>
      treeJson = d3.json("http://localhost:4001/pv-test.json", function(error, treeData) {
      	dTree.init(treeData,
					{
						target: "#graph",
						debug: true,
						hideMarriageNodes: false,
						marriageNodeSize: 10,
						nodeWidth: 120,
						height: 800,
						width: 1200,
						callbacks: {
							nodeClick: function(namr, extra) {
                document.location.href = "http://localhost:4001/pages/" + extra.id + ".html";

							},
							nodeRightClick: function(name, extra) {
								alert('Right-click: ' + name);
							},
							textRenderer: function(name, extra, textClass) {
								if (extra && extra.nickname)
									name = name + " <br><span class='small-text'>(" + extra.nickname + ")</span>";
								if (extra && extra.photo)
									name = name + " <br><img src='http://localhost:4001/assets/img/photo/" + extra.photo + "' class='img-fluid' height='90px'>";
								return "<p align='center' class='" + textClass + "'>" + name + "</p>";
							},
							marriageClick: function(extra, id) {
								alert('Clicked marriage node' + id);
							},
							marriageRightClick: function(extra, id) {
								alert('Right-clicked marriage node' + id);
							},
						}
					});
    	});
    </script>
</body>
